<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeamDrive</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--mute:#6b7280;--line:#e5e7eb;--acc:#2f6bff;--danger:#d93838}
@media (prefers-color-scheme:dark){:root{--bg:#111318;--card:#1a1d24;--ink:#e8eaf0;--mute:#9aa1ad;--line:#2a2e38;--acc:#5b8cff}}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
button,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:8px}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}button.d{color:var(--danger)}
input{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 10px;border-radius:8px;width:100%}
header{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
header b{font-size:17px}header .sp{flex:1}#search{max-width:320px}
main{max-width:1000px;margin:0 auto;padding:16px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.crumbs a{color:var(--acc);cursor:pointer;text-decoration:none}.crumbs span{color:var(--mute);margin:0 4px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
td,th{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left}th{font-size:12px;color:var(--mute);font-weight:600}
tr:last-child td{border-bottom:0}td.n{cursor:pointer}td.n:hover{color:var(--acc)}.m{color:var(--mute);font-size:13px}
.acts{white-space:nowrap;text-align:right}.acts button{padding:4px 8px;font-size:13px}
#drop{border:2px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--mute);margin-bottom:12px}
#drop.on{border-color:var(--acc);color:var(--acc)}
.login{max-width:340px;margin:12vh auto;background:var(--card);padding:24px;border-radius:12px;border:1px solid var(--line);display:grid;gap:10px}
.err{color:var(--danger);font-size:14px}.prog{font-size:13px;color:var(--mute)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:20px;width:min(420px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.4)}dialog form{display:grid;gap:10px}
select{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 10px;border-radius:8px;width:100%}
.row{display:flex;gap:8px;justify-content:flex-end}
@media (max-width:640px){.hide-s{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="picker" multiple hidden>
<dialog id="dlg"></dialog>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (b) => b < 1024 ? b + ' B' : b < 1048576 ? (b/1024).toFixed(1) + ' KB' : b < 1073741824 ? (b/1048576).toFixed(1) + ' MB' : (b/1073741824).toFixed(2) + ' GB';
const day = (d) => new Date(d).toLocaleDateString();
async function api(url, opts = {}) {
  const r = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts, body: opts.body && JSON.stringify(opts.body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Request failed');
  return j;
}
let me = null, folder = 'root', view = 'files';

// Generic modal. onOk(values) runs while it stays open; throwing shows the error in place.
function modal(title, fields, submit, onOk) {
  const d = $('#dlg');
  d.innerHTML = `<form><b>${esc(title)}</b>${fields.map((f) => f.options
      ? `<label class="m">${esc(f.label)}<select name="${f.name}">${f.options.map((o) => `<option value="${o.value}">${esc(o.label)}</option>`).join('')}</select></label>`
      : `<label class="m">${esc(f.label)}<input name="${f.name}" type="${f.type || 'text'}" ${f.min ? `minlength="${f.min}"` : ''} required></label>`).join('')}
    <div class="err" id="dlgErr"></div><div class="row"><button type="button" id="dlgX">Cancel</button><button class="p">${esc(submit)}</button></div></form>`;
  $('#dlgX').onclick = () => d.close();
  d.querySelector('form').onsubmit = async (e) => {
    e.preventDefault();
    $('#dlgErr').textContent = '';
    try { await onOk(Object.fromEntries(new FormData(e.target))); d.close(); }
    catch (err) { $('#dlgErr').textContent = err.message; }
  };
  d.showModal();
}

async function folderOptions(excludeId) {
  const all = await api('/api/folders-all');
  const byId = Object.fromEntries(all.map((f) => [f.id, f]));
  const pathOf = (f) => { const p = []; for (let c = f; c; c = byId[c.parent_id]) p.unshift(c.name); return p.join(' / '); };
  // hide the folder being moved and everything inside it
  const inside = (f) => { for (let c = f; c; c = byId[c.parent_id]) if (c.id === excludeId) return true; return false; };
  return [{ value: 'root', label: 'My team (top level)' },
    ...all.filter((f) => !inside(f)).map((f) => ({ value: f.id, label: pathOf(f) })).sort((a, b) => a.label.localeCompare(b.label))];
}
async function moveItem(kind, id) {
  const options = await folderOptions(kind === 'folder' ? Number(id) : null);
  modal('Move to…', [{ name: 'to', label: 'Destination folder', options }], 'Move', async (v) => {
    await api(`/api/${kind === 'folder' ? 'folders' : 'files'}/${id}`, { method: 'PATCH', body: kind === 'folder' ? { parent_id: v.to } : { folder_id: v.to } });
    render();
  });
}
function changePassword() {
  modal('Change password', [
    { name: 'current', label: 'Current password', type: 'password' },
    { name: 'password', label: 'New password (8+ characters)', type: 'password', min: 8 },
    { name: 'confirm', label: 'Repeat new password', type: 'password', min: 8 }], 'Save', async (v) => {
    if (v.password !== v.confirm) throw new Error("New passwords don't match");
    await api('/api/me/password', { method: 'POST', body: v });
    setTimeout(() => alert('Password changed.'));
  });
}
function resetPassword(id, name) {
  modal(`Reset password for ${name}`, [{ name: 'password', label: 'New password (8+ characters)', type: 'password', min: 8 }], 'Reset', async (v) => {
    await api(`/api/users/${id}/password`, { method: 'POST', body: v });
    setTimeout(() => alert('Password reset. Share it with them privately.'));
  });
}

function loginView(msg = '') {
  $('#app').innerHTML = `<form class="login" id="lf"><b style="font-size:20px">TeamDrive</b>
    <input name="email" type="email" placeholder="Email" required autocomplete="username">
    <input name="password" type="password" placeholder="Password" required autocomplete="current-password">
    <button class="p">Sign in</button><div class="err">${esc(msg)}</div></form>`;
  $('#lf').onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    try { me = await api('/api/login', { method: 'POST', body: { email: f.get('email'), password: f.get('password') } }); shell(); }
    catch (err) { loginView(err.message); }
  };
}

function shell() {
  $('#app').innerHTML = `<header><b>TeamDrive</b>
    <button data-v="files">Files</button><button data-v="trash">Trash</button>${me.is_admin ? '<button data-v="users">Users</button>' : ''}
    <div class="sp"></div><input id="search" placeholder="Search files…"><span class="m hide-s">${esc(me.name)}</span><button id="pw">Password</button><button id="out">Sign out</button></header><main id="main"></main>`;
  $('#pw').onclick = changePassword;
  document.querySelectorAll('[data-v]').forEach((b) => b.onclick = () => { view = b.dataset.v; folder = 'root'; render(); });
  $('#out').onclick = async () => { await api('/api/logout', { method: 'POST' }); me = null; loginView(); };
  let t; $('#search').oninput = (e) => { clearTimeout(t); t = setTimeout(() => { view = e.target.value.trim() ? 'search' : 'files'; render(); }, 250); };
  render();
}

function rows(folders, files, opts = {}) {
  const fr = folders.map((f) => `<tr><td class="n" data-open="${f.id}">📁 ${esc(f.name)}</td><td class="m hide-s">${esc(f.owner || '')}</td><td class="m hide-s">—</td><td class="m hide-s">${f.created_at ? day(f.created_at) : ''}</td>
    <td class="acts">${opts.trash ? tAct('folder', f.id) : `<button data-mv-f="${f.id}">Move</button> <button data-ren-f="${f.id}" data-name="${esc(f.name)}">Rename</button> <button class="d" data-del-f="${f.id}">Delete</button>`}</td></tr>`).join('');
  const fl = files.map((f) => `<tr><td class="n" data-dl="${f.id}">📄 ${esc(f.name)}</td><td class="m hide-s">${esc(f.owner || '')}</td><td class="m hide-s">${fmt(f.size)}</td><td class="m hide-s">${day(f.created_at || f.deleted_at)}</td>
    <td class="acts">${opts.trash ? tAct('file', f.id) : `<button data-share="${f.id}">Share</button> <button data-mv="${f.id}">Move</button> <button data-ren="${f.id}" data-name="${esc(f.name)}">Rename</button> <button class="d" data-del="${f.id}">Delete</button>`}</td></tr>`).join('');
  return `<table><tr><th>Name</th><th class="hide-s">Owner</th><th class="hide-s">Size</th><th class="hide-s">Date</th><th></th></tr>${fr + fl || '<tr><td colspan="5" class="m">Nothing here yet.</td></tr>'}</table>`;
}
const tAct = (type, id) => `<button data-restore="${type}:${id}">Restore</button>${me.is_admin ? ` <button class="d" data-purge="${type}:${id}">Delete forever</button>` : ''}`;

function bind() {
  const on = (sel, fn) => document.querySelectorAll(`[${sel}]`).forEach((el) => el.onclick = () => fn(el.getAttribute(sel), el));
  on('data-open', (id) => { view = 'files'; folder = id; $('#search').value = ''; render(); });
  on('data-dl', (id) => { location.href = `/api/files/${id}/download`; });
  on('data-del', async (id) => { await api(`/api/files/${id}`, { method: 'DELETE' }); render(); });
  on('data-del-f', async (id) => { if (confirm('Move folder and its contents to Trash?')) { await api(`/api/folders/${id}`, { method: 'DELETE' }); render(); } });
  on('data-ren', async (id, el) => { const n = prompt('New name', el.dataset.name); if (n) { await api(`/api/files/${id}`, { method: 'PATCH', body: { name: n } }); render(); } });
  on('data-ren-f', async (id, el) => { const n = prompt('New name', el.dataset.name); if (n) { await api(`/api/folders/${id}`, { method: 'PATCH', body: { name: n } }); render(); } });
  on('data-share', async (id) => {
    const d = prompt('Link expires after how many days? (0 = never)', '7'); if (d === null) return;
    const { url } = await api(`/api/files/${id}/share`, { method: 'POST', body: { days: Number(d) } });
    try { await navigator.clipboard.writeText(url); alert('Link copied:\n' + url); } catch { prompt('Share link:', url); }
  });
  on('data-mv', (id) => moveItem('file', id));
  on('data-mv-f', (id) => moveItem('folder', id));
  on('data-restore', async (v) => { const [t, id] = v.split(':'); await api(`/api/trash/${t}/${id}/restore`, { method: 'POST' }); render(); });
  on('data-purge', async (v) => { const [t, id] = v.split(':'); if (confirm('Permanently delete? This cannot be undone.')) { await api(`/api/trash/${t}/${id}`, { method: 'DELETE' }); render(); } });
}

async function render() {
  const m = $('#main');
  try {
    if (view === 'files') {
      const d = await api(`/api/folders/${folder}`);
      const crumbs = [`<a data-open="root">My team</a>`, ...d.crumbs.map((c) => `<a data-open="${c.id}">${esc(c.name)}</a>`)].join('<span>/</span>');
      m.innerHTML = `<div class="bar"><div class="crumbs" style="flex:1">${crumbs}</div><button id="nf">New folder</button><button class="p" id="up">Upload</button></div>
        <div id="drop">Drag files here to upload</div><div id="prog" class="prog"></div>${rows(d.folders, d.files)}`;
      $('#nf').onclick = async () => { const n = prompt('Folder name'); if (n) { await api('/api/folders', { method: 'POST', body: { name: n, parent_id: folder } }); render(); } };
      $('#up').onclick = () => $('#picker').click();
      const drop = $('#drop');
      drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('on'); };
      drop.ondragleave = () => drop.classList.remove('on');
      drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove('on'); upload([...e.dataTransfer.files]); };
    } else if (view === 'search') {
      const d = await api(`/api/search?q=${encodeURIComponent($('#search').value)}`);
      m.innerHTML = `<div class="bar"><b>Search results</b></div>${rows(d.folders, d.files)}`;
    } else if (view === 'trash') {
      const d = await api('/api/trash');
      m.innerHTML = `<div class="bar"><b>Trash</b><span class="m">Restore anything deleted by mistake.${me.is_admin ? ' "Delete forever" removes it from TeamDrive; the stored file is kept 30 more days, then erased.' : ''}</span></div>${rows(d.folders, d.files, { trash: true })}`;
    } else if (view === 'users') {
      const us = await api('/api/users');
      m.innerHTML = `<div class="bar"><b>Team members</b></div>
        <form id="uf" class="bar"><input name="name" placeholder="Name" required style="max-width:180px"><input name="email" type="email" placeholder="Email" required style="max-width:220px">
        <input name="password" type="password" placeholder="Temp password (8+)" required minlength="8" style="max-width:200px"><label class="m"><input type="checkbox" name="is_admin" style="width:auto"> Admin</label><button class="p">Add</button></form>
        <table><tr><th>Name</th><th>Email</th><th>Role</th><th></th></tr>${us.map((u) => `<tr><td>${esc(u.name)}</td><td class="m">${esc(u.email)}</td><td class="m">${u.is_admin ? 'Admin' : 'Member'}</td>
        <td class="acts">${u.id === me.id ? '' : `<button data-rp="${u.id}" data-name="${esc(u.name)}">Reset password</button> <button class="d" data-du="${u.id}">Remove</button>`}</td></tr>`).join('')}</table>`;
      document.querySelectorAll('[data-rp]').forEach((b) => b.onclick = () => resetPassword(b.dataset.rp, b.dataset.name));
      $('#uf').onsubmit = async (e) => { e.preventDefault(); const f = new FormData(e.target);
        try { await api('/api/users', { method: 'POST', body: { name: f.get('name'), email: f.get('email'), password: f.get('password'), is_admin: !!f.get('is_admin') } }); render(); } catch (err) { alert(err.message); } };
      document.querySelectorAll('[data-du]').forEach((b) => b.onclick = async () => { if (confirm('Remove this user?')) { try { await api(`/api/users/${b.dataset.du}`, { method: 'DELETE' }); render(); } catch (err) { alert(err.message); } } });
    }
    bind();
  } catch (err) {
    if (err.message === 'Not signed in') return loginView();
    m.innerHTML = `<div class="err">${esc(err.message)}</div>`;
  }
}

function put(url, file, onp) {
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest();
    x.open('PUT', url); x.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
    x.upload.onprogress = (e) => e.lengthComputable && onp(e.loaded / e.total);
    x.onload = () => (x.status < 300 ? res() : rej(new Error('Storage upload failed (' + x.status + ')')));
    x.onerror = () => rej(new Error('Network error — check R2 CORS settings'));
    x.send(file);
  });
}
async function upload(files) {
  const p = $('#prog');
  for (const [i, f] of files.entries()) {
    try {
      const { id, url } = await api('/api/files/init', { method: 'POST', body: { name: f.name, size: f.size, mime: f.type, folder_id: folder } });
      await put(url, f, (r) => p.textContent = `Uploading ${f.name} (${i + 1}/${files.length}) — ${Math.round(r * 100)}%`);
      await api(`/api/files/${id}/complete`, { method: 'POST' });
    } catch (err) { alert(`${f.name}: ${err.message}`); }
  }
  p.textContent = ''; render();
}
$('#picker').onchange = (e) => { upload([...e.target.files]); e.target.value = ''; };

api('/api/me').then((u) => { me = u; shell(); }).catch(() => loginView());
</script>
</body>
</html>
