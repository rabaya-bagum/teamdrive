<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeamDrive</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--mute:#6b7280;--line:#e5e7eb;--acc:#2563eb;--danger:#d93838;--hover:#f1f3f7}
@media (prefers-color-scheme:dark){:root{--bg:#111318;--card:#1a1d24;--ink:#e8eaf0;--mute:#9aa1ad;--line:#2a2e38;--acc:#5b8cff;--hover:#22262f}:root button.p{color:#0f1626}:root button.p:hover{background:#82a6ff}:root .autherr{color:#ffb4b4}.spin{border-color:rgba(15,22,38,.35);border-top-color:#0f1626}}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:8px}
button:hover{background:var(--hover)}button:disabled{opacity:.45;cursor:not-allowed}button.p{background:var(--acc);border-color:var(--acc);color:#fff}button.p:hover{background:#1d4ed8}button.d{color:var(--danger)}
button.on{border-color:var(--acc);color:var(--acc)}
/* Section tabs: current tab is filled; keyboard focus is a separate outline ring */
.tabs{display:flex;gap:2px;padding:3px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:7px;color:var(--mute);font-weight:500}
.tabs button:hover{color:var(--ink);background:var(--hover)}
.tabs button[aria-current=page]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12),inset 0 -2px 0 var(--acc)}
header .ghost{border-color:transparent;background:none;color:var(--mute)}header .ghost:hover{color:var(--ink);background:var(--hover)}
header .ghost.on{color:var(--ink);border-color:var(--line);background:var(--bg);font-weight:600}
.vsep{width:1px;height:22px;background:var(--line);margin:0 4px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
/* Page title + path */
.pagehead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.path{flex:1;min-width:0}
.path ol{list-style:none;margin:0 0 2px;padding:0;display:flex;flex-wrap:wrap;gap:4px;font-size:14px;color:var(--mute)}
.path ol a{color:var(--mute);cursor:pointer;text-decoration:none}.path ol a:hover{color:var(--acc);text-decoration:underline}
.path ol li+li::before{content:"/";margin-right:4px;color:var(--line)}
.path h1{margin:0;font-size:22px;line-height:1.25;display:flex;align-items:center;gap:8px;word-break:break-word}
/* Icons */
.fi{width:20px;height:20px;flex:none}.fi.sm{width:16px;height:16px;vertical-align:-3px}.li{width:12px;height:12px;vertical-align:-1px;margin-right:3px}
.nm{display:inline-flex;align-items:center;gap:10px;vertical-align:middle;flex-wrap:wrap}
/* Rows */
tbody tr:hover td,tr.sel td{background:var(--hover)}
tr.sel td{background:color-mix(in srgb,var(--acc) 10%,var(--card))}
td.ck,th.ck{width:36px;padding-right:0}td.ck input,th.ck input{width:18px;height:18px;cursor:pointer}
.sorthint{font-size:12px;color:var(--mute);margin:6px 2px 0}
/* Bulk bar */
.bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--acc);border-radius:10px;padding:8px 12px;margin-bottom:12px}
.bulk b{margin-right:auto}.bulk[hidden]{display:none}
/* Empty state + drop target */
.empty{border:2px dashed var(--line);border-radius:14px;padding:56px 20px;display:grid;justify-items:center;gap:10px;text-align:center;color:var(--mute);background:var(--card)}
.empty svg{width:40px;height:40px;color:var(--acc)}.empty b{color:var(--ink);font-size:18px}
main.dragging{outline:2px dashed var(--acc);outline-offset:-6px;border-radius:12px;background:color-mix(in srgb,var(--acc) 5%,transparent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sortbtn{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;font-weight:600}.sortbtn:hover{color:var(--ink)}
@media (hover:none){.rc{display:none}}
@media (max-width:700px){.vsep{display:none}.dropnote{display:none}}
.dropnote{font-size:13px;color:var(--mute);margin:-6px 0 12px}
input,select{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 10px;border-radius:8px;width:100%}
input[type=checkbox]{width:auto}
header{display:flex;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
header b{font-size:17px;margin-right:6px}header .sp{flex:1}header button{padding:6px 10px}#search{max-width:200px}
@media (max-width:1180px) and (min-width:701px){#usage{display:none}}
#usage{font-size:13px;color:var(--mute)}.trialbar{background:#FFF6DD;color:#6B4E00;border-bottom:1px solid #F0DCA0;padding:8px 16px;font-size:14px;text-align:center}
@media (prefers-color-scheme:dark){.trialbar{background:#3A2F14;color:#F1D58F;border-color:#5A4720}}
.tag.warn{color:var(--danger);border-color:var(--danger)}#usage.warn{color:var(--danger);font-weight:600}
.team{font-size:13px;color:var(--mute);border-left:1px solid var(--line);padding-left:10px;margin-right:4px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px;min-width:90px}.qbar i{display:block;height:100%;background:var(--acc)}.qbar i.hi{background:var(--danger)}
tr.bad td{color:var(--danger)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filters>*{width:auto;flex:0 1 auto}.filters input[type=search]{min-width:180px}
.when{white-space:nowrap}
main{max-width:1050px;margin:0 auto;padding:16px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.crumbs a{color:var(--acc);cursor:pointer}td a{color:var(--acc)}.login a{color:var(--acc)}.login a.home{color:inherit;text-decoration:none;justify-self:start}.login a.home:hover b{text-decoration:underline}.crumbs span{color:var(--mute);margin:0 4px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
td,th{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--mute);font-weight:600;user-select:none}th.s{cursor:pointer}th.s:hover{color:var(--ink)}
tr:last-child td{border-bottom:0}td.n{cursor:pointer;word-break:break-word}td.n:hover{color:var(--acc)}.m{color:var(--mute);font-size:13px}
.tag{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 7px;color:var(--mute);margin-left:6px;white-space:nowrap}
.acts{white-space:nowrap;text-align:right;width:1%}.acts button{padding:3px 10px}
#drop{border:2px dashed var(--line);border-radius:10px;padding:12px;text-align:center;color:var(--mute);margin-bottom:12px}
#drop.on{border-color:var(--acc);color:var(--acc)}
@font-face{font-family:"Bricolage Grotesque";src:url(/fonts/bricolage-grotesque.woff2) format("woff2");font-weight:200 800;font-display:swap}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.authpage{--paper:#EEF2F6;--ink2:#16213A;--manila:#F3C969;--manila-edge:#D9A93A;--mute2:#5B6475;max-width:none;width:100%;margin:0;min-height:100vh;min-height:100dvh;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px;color:var(--ink2)}
@media (prefers-color-scheme:dark){.authpage{--paper:#0F1626;--ink2:#E7ECF5;--manila:#C9A24A;--manila-edge:#A5822E;--mute2:#9AA6BC}}
.authbrand{font:700 22px/1 "Bricolage Grotesque",system-ui,sans-serif;color:var(--ink2);text-decoration:none;margin-bottom:28px;letter-spacing:-.01em}
.authbrand span{font:400 14px system-ui,sans-serif;color:var(--mute2);margin-left:6px}
.authbrand:hover{text-decoration:underline}
.auth{width:min(400px,100%)}
.authbody{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--manila);border-radius:12px;box-shadow:0 12px 32px rgba(22,33,58,.10)}
.authbody form{color:var(--ink);padding:28px 26px;display:grid;gap:16px}
.authbody h1{font:700 26px/1.15 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.015em;margin:0}
.authbody .lead{margin:-6px 0 0;font-size:15px}
.fld{display:grid;gap:6px}.fld label{font-weight:600;font-size:15px}
.fld input{padding:11px 12px;font-size:16px;border-width:1.5px;background:var(--card);color:var(--ink)}
.fld input:-webkit-autofill,.fld input:-webkit-autofill:hover,.fld input:-webkit-autofill:focus{-webkit-text-fill-color:var(--ink);caret-color:var(--ink);-webkit-box-shadow:0 0 0 1000px var(--card) inset;box-shadow:0 0 0 1000px var(--card) inset;transition:background-color 9999s}
.fld input:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 1000px var(--card) inset,0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
@media (prefers-color-scheme:dark){.fld input{background:#12161d;border-color:#323846}.fld input:-webkit-autofill{-webkit-box-shadow:0 0 0 1000px #12161d inset;box-shadow:0 0 0 1000px #12161d inset}}
.fld input:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
.fld input[aria-invalid=true]{border-color:var(--danger)}
.hint{margin:0;font-size:13px;color:var(--mute)}
#code2fa{font-size:22px;letter-spacing:6px;text-align:center}
.pwbox{position:relative}.pwbox input{padding-right:48px}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:none;color:var(--mute);display:grid;place-items:center;border-radius:8px;padding:0}
.eye:hover{color:var(--ink);background:var(--hover)}.eye[aria-pressed=true]{color:var(--acc)}
.autherr{background:color-mix(in srgb,var(--danger) 10%,var(--card));border:1px solid color-mix(in srgb,var(--danger) 45%,transparent);color:#a61b1b;border-radius:8px;padding:10px 12px;font-size:14px}
button.big,:root .authbody button.big{background:#2563eb;border-color:#2563eb;color:#fff}
:root .authbody button.big:hover{background:#1d4ed8}
:root .authbody .spin{border-color:rgba(255,255,255,.45);border-top-color:#fff}
button.big{padding:12px;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;min-height:46px}
button.big:disabled{opacity:.85;cursor:progress}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mute)}
.authbody form p.m{margin:0;font-size:14px}.authbody a{color:var(--acc)}
.authlegal{max-width:400px;text-align:center;font-size:13px;color:var(--ink2);opacity:.8;margin:20px 0 0;line-height:1.5}.authlegal a{color:inherit;text-decoration:underline}
.login{max-width:340px;margin:12vh auto;background:var(--card);padding:24px;border-radius:12px;border:1px solid var(--line);display:grid;gap:10px}
.err{color:var(--danger);font-size:14px}.prog{font-size:13px;color:var(--mute);margin-bottom:8px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:20px;width:min(440px,94vw);max-height:90vh}
dialog.wide{width:min(960px,96vw)}dialog::backdrop{background:rgba(0,0,0,.45)}dialog form{display:grid;gap:10px}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.menu{position:absolute;z-index:50;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);padding:4px;min-width:170px}
.menu button{display:block;width:100%;text-align:left;border:0;border-radius:6px;padding:7px 10px}
.pv{display:flex;justify-content:center;align-items:center;background:var(--bg);border-radius:8px;min-height:200px;max-height:70vh;overflow:auto}
.pv img,.pv video{max-width:100%;max-height:70vh}.pv iframe{width:100%;height:70vh;border:0;background:#fff}
.members{display:grid;gap:6px;max-height:40vh;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px}
.members label{display:flex;gap:8px;align-items:center}
.copy{display:flex;gap:6px}.copy input{flex:1}
.steps{margin:0;padding-left:20px;display:grid;gap:12px}.steps li{padding-left:4px}
.qr{margin:8px 0}.qr img{background:#fff;padding:8px;border-radius:8px;border:1px solid var(--line)}
code{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--bg);padding:2px 6px;border-radius:5px;word-break:break-all}
pre.codes{font:14px/1.9 ui-monospace,SFMono-Regular,Menlo,monospace;columns:2;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:0}
#code2fa{font-size:22px;letter-spacing:4px;text-align:center}
.mob{display:none}
@media (max-width:700px){td,th{padding:8px}td{overflow-wrap:anywhere}.when{white-space:normal;font-size:12px;width:24%}.mob{display:block}.mob:empty{display:none}.hide-s{display:none}#search{max-width:none;order:9;flex-basis:100%}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.6l2 2.2h8.4A1.5 1.5 0 0 1 21 8.7v9.8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z" fill="#F3C969" stroke="#B88A22" stroke-width="1.2"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M6.5 3h7.8L19 7.7v12.8a.5.5 0 0 1-.5.5h-12a.5.5 0 0 1-.5-.5V3.5a.5.5 0 0 1 .5-.5z" fill="#fff" stroke="#7B8496" stroke-width="1.3"/><path d="M14 3v5h5" fill="none" stroke="#7B8496" stroke-width="1.3"/></symbol>
  <symbol id="i-text" viewBox="0 0 24 24"><use href="#i-file"/><path d="M9 12h6M9 15h6M9 18h4" stroke="#9AA3B2" stroke-width="1.3"/></symbol>

<dialog id="dlg"></dialog>
<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (b) => { b = Number(b); return b < 1024 ? b + ' B' : b < 1048576 ? (b/1024).toFixed(1) + ' KB' : b < 1073741824 ? (b/1048576).toFixed(1) + ' MB' : (b/1073741824).toFixed(2) + ' GB'; };
const day = (d) => d ? new Date(d).toLocaleDateString() : '';
// "just now", "5 min ago", "3 hours ago", "Yesterday", "4 days ago", "Oct 29", "Oct 29, 2025"
function rel(d) {
  if (!d) return '';
  const t = new Date(d), s = (Date.now() - t) / 1000;
  if (s < 60) return 'Just now';
  if (s < 3600) return `${Math.floor(s / 60)} min ago`;
  if (s < 86400) return `${Math.floor(s / 3600)} hour${s < 7200 ? '' : 's'} ago`;
  const days = Math.floor(s / 86400);
  if (days === 1) return 'Yesterday';
  if (days < 7) return `${days} days ago`;
  return t.toLocaleDateString([], t.getFullYear() === new Date().getFullYear() ? { month: 'short', day: 'numeric' } : { month: 'short', day: 'numeric', year: 'numeric' });
}
const dateCell = (d) => d ? `<time datetime="${new Date(d).toISOString()}" title="${esc(new Date(d).toLocaleString([], { dateStyle: 'full', timeStyle: 'short' }))}">${esc(rel(d))}</time>` : '';
function iconFor(f) {
  const m = f.mime || '', n = (f.name || '').toLowerCase();
  const id = m.startsWith('image/') ? 'image' : m.startsWith('video/') ? 'video' : m.startsWith('audio/') ? 'audio'
    : m === 'application/pdf' || n.endsWith('.pdf') ? 'pdf'
    : /\.(docx?|odt|rtf|pages)$/.test(n) ? 'doc' : /\.(xlsx?|ods|csv|numbers)$/.test(n) ? 'sheet' : /\.(pptx?|odp|key)$/.test(n) ? 'slides'
    : /\.(zip|rar|7z|tar|gz)$/.test(n) ? 'zip' : m.startsWith('text/') || /\.(md|txt|json)$/.test(n) ? 'text' : 'file';
  return `<svg class="fi" aria-hidden="true"><use href="#i-${id}"/></svg>`;
}
const FOLDER_ICON = '<svg class="fi" aria-hidden="true"><use href="#i-folder"/></svg>';
const LOCK = '<svg class="li" aria-hidden="true"><use href="#i-lock"/></svg>';
const when = (d) => d ? new Date(d).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : '';
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

async function api(url, opts = {}) {
  const r = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts, body: opts.body && JSON.stringify(opts.body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || 'Request failed'), { data: j, status: r.status });
  return j;
}
let me = null, folder = 'root', view = 'files', sort = store.get('td-sort', { key: 'name', dir: 1 });

// ---------- Modal ----------
// modal({title, body, submit, onOk, wide}) – onOk(values) runs while open; throwing shows the error.
function modal({ title, body, submit, onOk, wide, cancel = 'Cancel' }) {
  const d = $('#dlg');
  d.className = wide ? 'wide' : '';
  d.innerHTML = `<form><b>${esc(title)}</b>${body}<div class="err" id="dlgErr"></div>
    <div class="row"><button type="button" id="dlgX">${esc(cancel)}</button>${submit ? `<button class="p">${esc(submit)}</button>` : ''}</div></form>`;
  $('#dlgX').onclick = () => d.close();
  d.querySelector('form').onsubmit = async (e) => {
    e.preventDefault();
    if (!onOk) return d.close();
    $('#dlgErr').textContent = '';
    try { if ((await onOk(Object.fromEntries(new FormData(e.target)), e.target)) !== false) d.close(); }
    catch (err) { $('#dlgErr').textContent = err.message; }
  };
  if (!d.open) d.showModal();
  return d;
}

function menu(anchor, items, at) {
  closeMenu();
  const m = document.createElement('div');
  m.className = 'menu'; m.id = 'menu';
  m.innerHTML = items.filter(Boolean).map((it, i) => `<button data-i="${i}" class="${it.danger ? 'd' : ''}">${esc(it.label)}</button>`).join('');
  document.body.appendChild(m);
  if (at) {
    m.style.top = `${window.scrollY + Math.min(at.y, innerHeight - m.offsetHeight - 8)}px`;
    m.style.left = `${window.scrollX + Math.max(8, Math.min(at.x, innerWidth - m.offsetWidth - 8))}px`;
  } else {
    const r = anchor.getBoundingClientRect();
    m.style.top = `${window.scrollY + r.bottom + 4}px`;
    m.style.left = `${Math.max(8, window.scrollX + r.right - m.offsetWidth)}px`;
  }
  $('button', m)?.focus();
  m.onkeydown = (e) => { if (e.key === 'Escape') { closeMenu(); anchor?.focus?.(); } };
  const list = items.filter(Boolean);
  $$('button', m).forEach((b) => b.onclick = () => { closeMenu(); list[b.dataset.i].run(); });
  setTimeout(() => document.addEventListener('click', closeMenu, { once: true }));
}

function loginView(msg = '') {

// Calendar days left in a free trial: null = no trial, 0 = last day, -1 = ended.
const trialLeft = (end) => {
  if (!end) return null;
  const e = new Date(end);
  if (e < Date.now()) return -1;
  const a = new Date(); a.setHours(0, 0, 0, 0);
  const b = new Date(e); b.setHours(0, 0, 0, 0);
  return Math.round((b - a) / 864e5);
};

// ---------- Listing ----------
const sorters = {
  name: (a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }),
  size: (a, b) => (a.size ?? -1) - (b.size ?? -1),
  date: (a, b) => new Date(a.updated_at || a.created_at || a.deleted_at) - new Date(b.updated_at || b.created_at || b.deleted_at),
};
const sorted = (arr) => [...arr].sort((a, b) => sorters[sort.key](a, b) * sort.dir || sorters.name(a, b));
const th = (key, label, cls = '') => `<th class="${cls}" ${sort.key === key ? `aria-sort="${sort.dir > 0 ? 'ascending' : 'descending'}"` : ''}><button class="sortbtn" data-sort="${key}" title="Sort by ${label}">${label}${sort.key === key ? (sort.dir > 0 ? ' ▲' : ' ▼') : ''}</button></th>`;
const PREVIEWABLE = /^(image\/(png|jpe?g|gif|webp|avif|bmp|svg\+xml)|video\/(mp4|webm|ogg|quicktime)|audio\/|application\/pdf|text\/|application\/(json|xml|javascript))/;

function table(folders, files, { trash = false, select = false, owner = true } = {}) {
  const ck = (kind, id, name) => select ? `<td class="ck"><input type="checkbox" data-pick="${kind}:${id}" aria-label="Select ${esc(name)}"></td>` : '';
  const fr = sorted(folders).map((f) => `<tr data-row="folder:${f.id}">${ck('folder', f.id, f.name)}
    <td class="n" data-open="${f.id}"><span class="nm">${FOLDER_ICON}<span>${esc(f.name)}</span>${f.restricted ? `<span class="tag">${LOCK}restricted</span>` : ''}</span></td>
    ${owner ? `<td class="m hide-s">${esc(f.owner || '')}</td>` : ''}<td class="m hide-s">${f.items == null ? '—' : `${f.items} item${f.items === 1 ? '' : 's'}`}</td>
    <td class="m hide-s">${dateCell(f.created_at || f.deleted_at)}</td>
    <td class="acts"><button data-fmenu="${f.id}" aria-label="Actions for ${esc(f.name)}">⋯</button></td></tr>`).join('');
  const fl = sorted(files).map((f) => `<tr data-row="file:${f.id}">${ck('file', f.id, f.name)}
    <td class="n" data-file="${f.id}"><span class="nm">${iconFor(f)}<span>${esc(f.name)}</span>${f.versions > 0 ? `<span class="tag">${Number(f.versions) + 1} versions</span>` : ''}</span></td>
    ${owner ? `<td class="m hide-s">${esc(f.owner || '')}</td>` : ''}<td class="m hide-s">${fmt(f.size)}</td>
    <td class="m hide-s">${dateCell(f.updated_at || f.deleted_at)}</td>
    <td class="acts"><button data-menu="${f.id}" aria-label="Actions for ${esc(f.name)}">⋯</button></td></tr>`).join('');
  const cols = 4 + (select ? 1 : 0) + (owner ? 1 : 0);
  return `<table><thead><tr>${select ? '<th class="ck"><input type="checkbox" id="pickAll" aria-label="Select all"></th>' : ''}${th('name', 'Name')}${owner ? '<th class="hide-s">Owner</th>' : ''}${th('size', 'Size', 'hide-s')}${th('date', trash ? 'Deleted' : 'Modified', 'hide-s')}<th><span class="sr">Actions</span></th></tr></thead>
    <tbody>${fr + fl || `<tr><td colspan="${cols}" class="m">${trash ? 'Trash is empty.' : 'Nothing here yet.'}</td></tr>`}</tbody></table>`;

const folderItems = (f) => [

  { label: 'Download', run: () => { location.href = `/api/files/${f.id}/download`; } },

function bindTable(folders, files, { trash = false } = {}) {
  const F = Object.fromEntries(folders.map((f) => [f.id, f])), G = Object.fromEntries(files.map((f) => [f.id, f]));
  const itemsFor = (kind, id) => kind === 'folder' ? (trash ? trashItems('folder', F[id]) : folderItems(F[id])) : (trash ? trashItems('file', G[id]) : fileItems(G[id]));
  $$('[data-sort]').forEach((h) => h.onclick = () => {
    sort = sort.key === h.dataset.sort ? { key: sort.key, dir: -sort.dir } : { key: h.dataset.sort, dir: h.dataset.sort === 'name' ? 1 : -1 };
    store.set('td-sort', sort); render();
  });
  $$('[data-open]').forEach((el) => el.onclick = (e) => { e.preventDefault(); if (trash) return; view = 'files'; folder = el.dataset.open; $('#search').value = ''; render(); });
  $$('[data-file]').forEach((el) => el.onclick = () => { if (trash) return; openFile(G[el.dataset.file]); });
  $$('[data-fmenu]').forEach((b) => b.onclick = (e) => { e.stopPropagation(); menu(b, itemsFor('folder', Number(b.dataset.fmenu))); });
  $$('[data-menu]').forEach((b) => b.onclick = (e) => { e.stopPropagation(); menu(b, itemsFor('file', Number(b.dataset.menu))); });
  // Right-click a row for the same actions
  $$('tr[data-row]').forEach((tr) => tr.oncontextmenu = (e) => {
    e.preventDefault(); e.stopPropagation();
    const [kind, id] = tr.dataset.row.split(':');
    menu($('.acts button', tr), itemsFor(kind, Number(id)), { x: e.clientX, y: e.clientY });
  });
  // Multi-select
  const picks = $$('[data-pick]');
  if (!picks.length) return;
  const bar = $('#bulk');
  const chosen = () => picks.filter((c) => c.checked).map((c) => { const [kind, id] = c.dataset.pick.split(':'); return { kind, id: Number(id), item: kind === 'folder' ? F[id] : G[id] }; });
  const sync = () => {
    const sel = chosen();
    picks.forEach((c) => c.closest('tr').classList.toggle('sel', c.checked));
    if ($('#pickAll')) { $('#pickAll').checked = sel.length === picks.length; $('#pickAll').indeterminate = sel.length > 0 && sel.length < picks.length; }
    if (!bar) return;
    bar.hidden = !sel.length;
    if (!sel.length) return;
    bar.innerHTML = `<b>${sel.length} selected</b><button id="bMove">Move…</button><button id="bDel" class="d">Delete</button><button id="bClear">Clear selection</button>`;
    $('#bClear').onclick = () => { picks.forEach((c) => (c.checked = false)); sync(); };
    $('#bMove').onclick = () => bulkMove(chosen());
    $('#bDel').onclick = () => bulkDelete(chosen());
  };
  picks.forEach((c) => c.onchange = sync);
  if ($('#pickAll')) $('#pickAll').onchange = (e) => { picks.forEach((c) => (c.checked = e.target.checked)); sync(); };
}
async function bulkRun(sel, fn, verb) {
  const failed = [];
  for (const s of sel) { try { await fn(s); } catch (err) { failed.push(`${s.item.name}: ${err.message}`); } }
  render();
  if (failed.length) setTimeout(() => notify(`${failed.length} item${failed.length === 1 ? '' : 's'} could not be ${verb}. ${failed.slice(0, 3).join('; ')}`));
}
async function bulkMove(sel) {
  const opts = await folderOptions(sel.filter((s) => s.kind === 'folder').map((s) => s.id));
  modal({ title: `Move ${sel.length} item${sel.length === 1 ? '' : 's'} to…`, submit: 'Move',
    body: `<label class="m">Destination folder<select name="to">${opts.map((o) => `<option value="${o.value}">${esc(o.label)}</option>`).join('')}</select></label>`,
    onOk: async (v) => { await bulkRun(sel, (s) => api(`/api/${s.kind === 'folder' ? 'folders' : 'files'}/${s.id}`, { method: 'PATCH', body: s.kind === 'folder' ? { parent_id: v.to } : { folder_id: v.to } }), 'moved'); } });
}
function bulkDelete(sel) {
  modal({ title: `Move ${sel.length} item${sel.length === 1 ? '' : 's'} to Trash?`, submit: 'Move to Trash',
    body: '<span class="m">Folders go with everything inside them. You can restore anything from Trash.</span>',
    onOk: async () => { await bulkRun(sel, (s) => api(`/api/${s.kind === 'folder' ? 'folders' : 'files'}/${s.id}`, { method: 'DELETE' }), 'moved to Trash'); } });
}

async function preview(f) {

    body: `<div class="pv">${media}</div>`, onOk: () => { location.href = `/api/files/${f.id}/download`; } });

async function folderOptions(excludeId) {
  const all = await api('/api/folders-all');
  const byId = Object.fromEntries(all.map((f) => [f.id, f]));
  const pathOf = (f) => { const p = []; for (let c = f; c; c = byId[c.parent_id]) p.unshift(c.name); return p.join(' / '); };
  const ex = new Set([].concat(excludeId ?? []).map(Number));
  const inside = (f) => { for (let c = f; c; c = byId[c.parent_id]) if (ex.has(c.id)) return true; return false; };
  return [{ value: 'root', label: 'My team (top level)' },
    ...all.filter((f) => !inside(f)).map((f) => ({ value: f.id, label: pathOf(f) })).sort((a, b) => a.label.localeCompare(b.label))];
}

  };
  let t;
  const apply = () => { clearTimeout(t); t = setTimeout(() => { for (const [id, k] of Object.entries(ids)) actFilter[k] = $('#' + id).value; load(false); }, 250); };
  Object.keys(ids).forEach((id) => { $('#' + id).oninput = apply; });
  $('#more').onclick = () => load(true);
  $('#csv').onclick = () => { location.href = `/api/activity.csv?${qs()}`; };
  await load(false);
}

      <td class="m hide-s">${esc(t.admins || '—')}</td><td class="m hide-s">${t.members}</td>
      <td class="m">${fmt(t.used)} ${t.quota_bytes ? `of ${fmt(t.quota_bytes)}<div class="qbar"><i class="${pct >= 90 ? 'hi' : ''}" style="width:${pct}%"></i></div>` : '· no limit'}</td>
      <td class="m hide-s">${day(t.created_at)}</td><td class="acts"><button data-tm="${t.id}">⋯</button></td></tr>`; }).join('')}</table>`;
  const byId = Object.fromEntries(teams.map((t) => [t.id, t]));
  const tempPw = () => Array.from(crypto.getRandomValues(new Uint8Array(12)), (b) => 'abcdefghjkmnpqrstuvwxyzACDEFGHJKLMNPQRSTUVWXYZ23456789'[b % 54]).join('');
  const newTeam = (pre = {}) => modal({ title: 'New team', submit: 'Create team',
    body: field('name', 'Team (company) name', 'text', `required value="${esc(pre.company || '')}"`) +
      field('quota_gb', 'Storage limit in GB (leave empty for no limit)', 'number', 'min="0" step="any" value="50"') +
      field('trial_days', 'Free trial length in days (0 = paying customer, no trial)', 'number', 'min="0" max="365" step="1" value="30"') +
      '<b style="margin-top:6px">First admin</b>' + field('admin_name', 'Name', 'text', `required value="${esc(pre.name || '')}"`) +
      field('admin_email', 'Email', 'email', `required value="${esc(pre.email || '')}"`) +
      field('admin_password', 'Temporary password (8+ characters)', 'text', `required minlength="8" autocomplete="off" value="${tempPw()}"`) +
      '<span class="m">They will be asked to set up two-step login the first time they sign in, and can change the password from their account menu.</span>',
    onOk: async (v) => {
      await api('/api/owner/teams', { method: 'POST', body: v });
      if (pre.id) await api(`/api/owner/requests/${pre.id}`, { method: 'PATCH', body: { handled: true } });
      render();
      setTimeout(() => notify(`Team "${v.name}" is ready${Number(v.trial_days) > 0 ? ` with a ${Number(v.trial_days)}-day free trial` : ''}. Email ${v.admin_email} the sign-in address (${location.origin}/login) and, separately, their temporary password: ${v.admin_password}`));

  $$('[data-rq-create]').forEach((b) => b.onclick = () => newTeam(R[b.dataset.rqCreate]));

  $$('[data-rq-undo]').forEach((b) => b.onclick = async () => { await api(`/api/owner/requests/${b.dataset.rqUndo}`, { method: 'PATCH', body: { handled: false } }); render(); });
  $$('[data-tm]').forEach((b) => b.onclick = (e) => { e.stopPropagation(); const t = byId[b.dataset.tm]; menu(b, [

        const iso = `${cur.getFullYear()}-${String(cur.getMonth() + 1).padStart(2, '0')}-${String(cur.getDate()).padStart(2, '0')}`;
        modal({ title: `Free trial for "${t.name}"`, submit: 'Save',
          body: field('trial_end', 'Trial ends on', 'date', `value="${iso}"`) +
            `<span class="m">Their admins see how many days are left. Nothing is switched off automatically when it ends.</span>
             ${t.trial_ends_at ? '<button type="button" id="endTrial">They\'re a paying customer now (end trial)</button>' : ''}`,
          onOk: async (v) => { if (!v.trial_end) throw new Error('Pick an end date'); await api(`/api/owner/teams/${t.id}`, { method: 'PATCH', body: { trial_end: v.trial_end } }); render(); } });
        const btn = $('#endTrial');
        if (btn) btn.onclick = async () => { await api(`/api/owner/teams/${t.id}`, { method: 'PATCH', body: { trial_end: '' } }); $('#dlg').close(); render(); };
      } },
    { label: 'Edit name & storage…', run: () => modal({ title: `Edit "${t.name}"`, submit: 'Save',
        body: field('name', 'Team name', 'text', `required value="${esc(t.name)}"`) +
          field('quota_gb', 'Storage limit in GB (empty = no limit)', 'number', `min="0" step="any" value="${t.quota_bytes ? +(t.quota_bytes / 1073741824).toFixed(2) : ''}"`),
        onOk: async (v) => { await api(`/api/owner/teams/${t.id}`, { method: 'PATCH', body: v }); render(); } }) },
    !t.mine && { label: t.disabled ? 'Enable team' : 'Disable team…', danger: !t.disabled, run: () => t.disabled
        ? api(`/api/owner/teams/${t.id}`, { method: 'PATCH', body: { disabled: false } }).then(render)
        : modal({ title: `Disable "${t.name}"?`, submit: 'Disable', body: '<span class="m">Its members are signed out and can\'t sign in, and its share links stop working. Files are kept; you can enable it again any time.</span>',
            onOk: async () => { await api(`/api/owner/teams/${t.id}`, { method: 'PATCH', body: { disabled: true } }); render(); } }) }]); });
}

// ---------- Uploads ----------
// Returns [{file, dirs: ["sub","dir"]}]
async function droppedFiles(dt) {
  const entries = [...(dt.items || [])].map((i) => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (!entries.length) return [...dt.files].map((file) => ({ file, dirs: [] }));
  const out = [];
  const readAll = (reader) => new Promise((res, rej) => { const all = []; const next = () => reader.readEntries((b) => b.length ? (all.push(...b), next()) : res(all), rej); next(); });
  async function walk(entry, dirs) {
    if (entry.isFile) out.push({ file: await new Promise((res, rej) => entry.file(res, rej)), dirs });
    else if (entry.isDirectory) for (const c of await readAll(entry.createReader())) await walk(c, [...dirs, entry.name]);
  }
  for (const e of entries) await walk(e, []);
  return out;
}
function put(url, file, onp) {
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest();
    x.open('PUT', url); x.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
    x.upload.onprogress = (e) => e.lengthComputable && onp(e.loaded / e.total);
    x.onload = () => (x.status < 300 ? res() : rej(new Error('Storage upload failed (' + x.status + ')')));
    x.onerror = () => rej(new Error('Network error — check R2 CORS settings'));
    x.send(file);
  });
}
async function upload(items) {
  if (!items.length) return;
  const base = folder, p = $('#prog'), cache = {}, errors = [];
  let versioned = 0;
  const target = async (dirs) => {
    if (!dirs.length) return base;
    const k = dirs.join('/');
    if (!cache[k]) cache[k] = api('/api/folders/ensure', { method: 'POST', body: { parent_id: base, path: dirs } }).then((r) => r.id);
    return cache[k];
  };
  for (const [i, { file, dirs }] of items.entries()) {
    if (file.name === '.DS_Store' || file.name === 'Thumbs.db') continue;
    try {
      const folder_id = await target(dirs);
      const { id, url } = await api('/api/files/init', { method: 'POST', body: { name: file.name, size: file.size, mime: file.type, folder_id } });
      await put(url, file, (r) => { if (p) p.textContent = `Uploading ${file.name} (${i + 1}/${items.length}) — ${Math.round(r * 100)}%`; });
      const r = await api(`/api/files/${id}/complete`, { method: 'POST' });
      if (r.versioned) versioned++;
    } catch (err) { errors.push(`${file.name}: ${err.message}`); }
  }
  if ($('#prog')) $('#prog').textContent = '';
  render();
  if (errors.length) notify(`${errors.length} upload(s) failed — ${errors.slice(0, 3).join('; ')}${errors.length > 3 ? '…' : ''}`);
  else if (versioned) notify(`${versioned} file(s) already existed and were saved as new versions.`);
}
function mountPickers() {
  if ($('#picker')) return;
  document.body.insertAdjacentHTML('beforeend', '<input type="file" id="picker" multiple hidden tabindex="-1" aria-hidden="true"><input type="file" id="dirPicker" webkitdirectory multiple hidden tabindex="-1" aria-hidden="true">');
  $('#picker').onchange = (e) => { upload([...e.target.files].map((file) => ({ file, dirs: [] }))); e.target.value = ''; };
  $('#dirPicker').onchange = (e) => {
  upload([...e.target.files].map((file) => ({ file, dirs: (file.webkitRelativePath || '').split('/').slice(0, -1) })));
  e.target.value = '';
};
}
